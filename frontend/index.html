<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO-DO List</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <main class="todo-app">
      <h1 class="title">todos</h1>

      <div class="app-card">
        <div class="input-row">
          <input id="todo-input" type="text" placeholder="What needs to be done?" />
          <button id="add-btn">Add</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="footer">
          <span id="left-counter">0 left</span>
          <div class="filters">
            <button data-filter="all" class="filter active">All</button>
            <button data-filter="active" class="filter">Active</button>
            <button data-filter="completed" class="filter">Completed</button>
          </div>
          <button id="clear-completed">Clear completed</button>
        </div>
      </div>
    </main>

    <script src="scripts/index.js"></script>
  </body>
</html>
